    <script>
      // 1. Detect if a JS or CSS chunk fails to load (e.g. Vercel deleted old hashes)
      window.addEventListener('error', function(e) {
        var target = e.target || e.srcElement;
        var isElementLoadError = target instanceof HTMLElement;
        if (isElementLoadError && (target.tagName.toLowerCase() === 'script' || target.tagName.toLowerCase() === 'link')) {
          console.warn("Detected missing chunk. Purging service workers and caches to recover...");
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          // Prevent infinite reload loops
          if (!sessionStorage.getItem('chunk_recovered')) {
            sessionStorage.setItem('chunk_recovered', 'true');
            window.location.reload(true);
          }
        }
      }, true);

      // 2. Standard Service Worker Registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
             // For Vercel, it is often safer to just kill old SWs on every fresh load to prevent them from breaking future deployments.
             // If we really want offline play, we can register it, but for a game, it's risky if caching breaks the SPA.
             // We'll register the new one.
             navigator.serviceWorker.register('/sw.js').then((reg) => {
               reg.onupdatefound = () => {
                 const installingWorker = reg.installing;
                 if (installingWorker) {
                   installingWorker.onstatechange = () => {
                     if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                       console.log('New update available. Reloading...');
                       window.location.reload();
                     }
                   };
                 }
               };
             }).catch(() => {});
          });
        });
      }
    </script>
  </head>
  <body class="bg-stone-950 text-white select-none overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
